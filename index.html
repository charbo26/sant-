<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="WHOOP">
<meta name="theme-color" content="#f5f5f3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d0d0e" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.json">
<title>WHOOP</title>
<style>
:root{--bg:#f5f5f3;--card:#fff;--fg:#141414;--muted:#888883;--line:#ebebe7;--soft:#f0f0ec;--hover:#fafaf8;
--green:#1fa463;--yellow:#cf9a00;--red:#e04a3f;--blue:#3a7bdc;--violet:#7a62d6;--teal:#159a94;--amber:#e08a1e;
--z1:#a9cdf7;--z2:#5fa3ef;--z3:#f0c04c;--z4:#ef8b3b;--z5:#e04a3f;--shadow:0 1px 2px rgba(0,0,0,.04),0 4px 16px rgba(0,0,0,.03)}
@media (prefers-color-scheme:dark){:root{--bg:#0d0d0e;--card:#17171a;--fg:#f1f1ef;--muted:#8b8b86;--line:#27272a;
--soft:#222226;--hover:#1c1c20;--shadow:none}}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--fg);font:15px/1.45 -apple-system,"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;
-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
a{color:inherit;text-decoration:none}
svg{shape-rendering:geometricPrecision;overflow:visible}
svg text{font-family:inherit}
.wrap{max-width:920px;margin:0 auto;padding:max(22px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(48px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.syncb{border:1px solid var(--line);background:var(--card);color:var(--fg);width:32px;height:32px;border-radius:50%;
font-size:16px;cursor:pointer;display:grid;place-items:center}
.syncb.spin{animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.sheet{position:fixed;left:50%;bottom:max(16px,env(safe-area-inset-bottom));transform:translate(-50%,140%);width:min(440px,calc(100% - 32px));
background:var(--fg);color:var(--bg);border-radius:16px;padding:14px 16px;font-size:13px;z-index:20;transition:transform .35s cubic-bezier(.2,.8,.2,1);
box-shadow:0 10px 40px rgba(0,0,0,.25)}
.sheet.show{transform:translate(-50%,0)}.sheet b{display:block;font-size:14px;margin-bottom:4px}.sheet .l{opacity:.7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:420px){.brand .bt{display:none}}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px;min-height:36px;
position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0;margin-top:-10px}
.brand{font-weight:700;letter-spacing:.2em;font-size:13px;display:flex;align-items:center;gap:10px}
.back{border:1px solid var(--line);background:var(--card);width:32px;height:32px;border-radius:50%;display:grid;
place-items:center;font-size:16px}
.tabs{display:flex;gap:3px;background:var(--soft);padding:3px;border-radius:999px}
.tabs a{color:var(--muted);font-size:13px;padding:6px 13px;border-radius:999px;transition:background .2s,color .2s}
.tabs a.on{background:var(--card);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08)}
main{animation:fade .35s ease both}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.datebar{display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:20px}
.datebar a,.datebar span.dis{border:1px solid var(--line);background:var(--card);width:34px;height:34px;
border-radius:50%;display:grid;place-items:center;font-size:17px;transition:background .2s}
.datebar a:hover{background:var(--hover)}.datebar span.dis{opacity:.3}
.datebar h1{font-size:17px;font-weight:600;min-width:210px;text-align:center}
.title{text-align:center;margin-bottom:20px}.title h1{font-size:22px;font-weight:650}
.title p{color:var(--muted);font-size:13px;margin-top:2px}
.rings{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:12px}
.ring{background:var(--card);border-radius:20px;padding:20px 8px 16px;text-align:center;box-shadow:var(--shadow);
transition:background .2s}
a.ring:hover,a.tile:hover,a.row:hover,a.card:hover{background:var(--hover)}
.ring svg{width:100%;height:auto;display:block;margin:0 auto 10px}
.arc{transition:stroke-dasharray 1.1s cubic-bezier(.2,.8,.2,1)}
.lbl{font-size:11px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;font-weight:600}
.sub{font-size:12px;color:var(--muted);margin-top:2px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:12px}
.tile{background:var(--card);border-radius:16px;padding:14px 16px;box-shadow:var(--shadow);display:block;transition:background .2s}
.tile .v{font-size:24px;font-weight:620;margin-top:4px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.tile .v small,.big small{font-size:12px;font-weight:400;color:var(--muted);margin-left:3px}
.delta{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.good{color:var(--green)}.bad{color:var(--red)}
.card{display:block;background:var(--card);border-radius:20px;padding:18px 18px 14px;margin-bottom:12px;box-shadow:var(--shadow);
transition:background .2s}
.card>h2{font-size:11px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;font-weight:600;
margin-bottom:12px;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.card>h2 span:last-child{letter-spacing:0;text-transform:none;font-weight:400}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(108px,1fr));gap:2px 12px;margin-bottom:12px}
.stat{padding:6px 0}.stat .k{font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.stat .x{font-size:18px;font-weight:600;font-variant-numeric:tabular-nums}
.stat .x small{font-size:11px;color:var(--muted);font-weight:400;margin-left:2px}.stat .n{font-size:11px;color:var(--muted)}
.chart{position:relative;width:100%;touch-action:pan-y}
.tip{position:absolute;pointer-events:none;background:var(--fg);color:var(--bg);font-size:12px;padding:5px 9px;
border-radius:8px;white-space:nowrap;transform:translate(-50%,-100%);top:0;opacity:0;transition:opacity .12s;z-index:2}
.cur,.dot{transition:opacity .12s}
.line{stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:draw 1s cubic-bezier(.3,.7,.2,1) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.area{opacity:0;animation:fadein .8s .25s forwards}@keyframes fadein{to{opacity:1}}
.bar{transform-box:fill-box;transform-origin:bottom;animation:grow .6s cubic-bezier(.3,.7,.2,1) both}
@keyframes grow{from{transform:scaleY(0)}}
.row{display:flex;justify-content:space-between;align-items:center;padding:12px 6px;margin:0 -6px;border-top:1px solid var(--line);
gap:12px;border-radius:10px;transition:background .2s}
.row:first-of-type{border-top:0}.row .t{font-weight:550}.row .s{font-size:12px;color:var(--muted)}
.row .r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.empty{color:var(--muted);font-size:13px;padding:6px 0}
.seg{display:flex;gap:3px;background:var(--soft);padding:3px;border-radius:999px;width:max-content;margin:0 auto 16px}
.seg a{font-size:12px;padding:5px 14px;border-radius:999px;color:var(--muted)}.seg a.on{background:var(--card);color:var(--fg)}
.two{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.two .card{margin:0}
.zbar{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--soft);margin:4px 0 12px}
.zrow{display:grid;grid-template-columns:70px 1fr 100px;align-items:center;gap:10px;font-size:13px;padding:4px 0}
.zrow .b{height:8px;border-radius:4px;background:var(--soft);overflow:hidden}.zrow .b i{display:block;height:100%}
.zrow .m{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.contrib{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:12px 0;border-top:1px solid var(--line)}
.contrib:first-of-type{border-top:0}.contrib .t{font-weight:550}.contrib .s{font-size:12px;color:var(--muted)}
.contrib .r{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.range{grid-column:1/3;height:6px;border-radius:3px;background:var(--soft);position:relative;margin-top:6px}
.range i{position:absolute;top:-3px;width:12px;height:12px;border-radius:50%;transform:translateX(-50%);border:2px solid var(--card)}
.range b{position:absolute;top:0;height:6px;border-radius:3px;background:var(--line)}
.timeline{position:relative;height:34px;border-radius:9px;background:var(--violet);overflow:hidden;margin:6px 0 4px}
.timeline i{position:absolute;top:0;bottom:0;background:var(--soft)}
.tl-l{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.verdict{font-size:14px;text-align:center;color:var(--muted);margin:12px auto 4px;max-width:540px}
.big{font-size:44px;font-weight:650;text-align:center;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.desc{font-size:13px;color:var(--muted);line-height:1.55}
.insight{display:flex;gap:12px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line);font-size:14px;line-height:1.45}
.insight:first-of-type{border-top:0}.insight .ic{width:26px;height:26px;border-radius:50%;flex:none;display:grid;place-items:center;
font-size:13px;font-weight:700;color:#fff}
.alert{border:1px solid color-mix(in srgb,var(--red) 35%,transparent);background:color-mix(in srgb,var(--red) 7%,var(--card))}
.cal{display:grid;grid-template-rows:repeat(7,1fr);grid-auto-flow:column;gap:4px;justify-content:start;overflow-x:auto;padding-bottom:4px}
.cal i{width:18px;height:18px;border-radius:5px;background:var(--soft);display:block}
.cal-l{display:flex;gap:14px;font-size:11px;color:var(--muted);margin-top:10px;align-items:center}
.cal-l i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:4px;vertical-align:-1px}
.corr{display:grid;grid-template-columns:1fr 120px 54px;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.corr:first-of-type{border-top:0}.corr .s{font-size:12px;color:var(--muted)}
.cbar{height:8px;background:var(--soft);border-radius:4px;position:relative}
.cbar i{position:absolute;top:0;height:8px;border-radius:4px}.cbar:after{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--muted);opacity:.5}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.week a{background:var(--soft);border-radius:12px;padding:8px 2px;transition:background .2s}.week a:hover{background:var(--line)}
.week .dn{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.week .rc{width:30px;height:30px;border-radius:50%;margin:6px auto;display:grid;place-items:center;font-size:12px;font-weight:650;color:#fff}
.week .sm{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.cmp{display:grid;grid-template-columns:1fr auto auto;gap:4px 16px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.cmp:first-of-type{border-top:0}.cmp .v{font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
.rec{display:flex;justify-content:space-between;padding:11px 0;border-top:1px solid var(--line)}.rec:first-of-type{border-top:0}
.rec .v{font-weight:650;font-variant-numeric:tabular-nums}.rec .s{font-size:12px;color:var(--muted)}
footer{margin-top:24px;font-size:12px;color:var(--muted);text-align:center;line-height:1.8}
@media (max-width:640px){.grid{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}
.rings{gap:8px}.ring{padding:14px 4px 12px}.datebar h1{min-width:0;font-size:15px}.big{font-size:36px}
.tabs a{padding:6px 10px}.corr{grid-template-columns:1fr 80px 46px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.line{stroke-dasharray:none}}
</style>
</head>
<body>
<div class="wrap">
  <header id="head"></header>
  <main id="app"></main>
  <footer id="foot"></footer>
</div>
<script id="data" type="application/json">{}</script>
<script>
window.addEventListener('error', e => { const a = document.getElementById('app');
  if (a && !a.innerHTML.trim()) a.innerHTML = '<div class="card"><b>L’appli n’a pas pu s’afficher.</b><p class="desc" style="margin-top:6px">'
    + String(e.message).replace(/[<>&]/g, '') + ' (ligne ' + e.lineno + ')</p><p class="desc">Envoie une capture de cet écran pour corriger le problème.</p></div>'; });
</script>
<script type="text/whoop-ui" id="ui">
const D = window.D_DATA;
const app = document.getElementById('app'), head = document.getElementById('head');
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const NEED = D.profile.sleepNeed * 60, HRMAX = D.profile.hrMax;
const IDX = Object.fromEntries(D.days.map((d, i) => [d.date, i]));
const LAST = D.days.length ? D.days[D.days.length - 1].date : null;

// ---------- formatage
const fmt = (v, d = 0) => v == null || isNaN(v) ? '—' : Number(v).toLocaleString('fr-FR', {maximumFractionDigits: d, minimumFractionDigits: d});
const hm = m => m == null ? '—' : `${Math.floor(m / 60)} h ${String(Math.round(m % 60)).padStart(2, '0')}`;
const hhmm = m => { m = ((Math.round(m) % 1440) + 1440) % 1440; return `${String(Math.floor(m / 60)).padStart(2, '0')}:${String(m % 60).padStart(2, '0')}`; };
const clock = iso => iso ? new Date(iso).toLocaleTimeString('fr-FR', {hour: '2-digit', minute: '2-digit'}) : '—';
const longDate = iso => new Date(iso + 'T12:00').toLocaleDateString('fr-FR', {weekday: 'long', day: 'numeric', month: 'long'});
const shortDate = iso => new Date(iso + 'T12:00').toLocaleDateString('fr-FR', {day: 'numeric', month: 'short'});
const dayShort = iso => new Date(iso + 'T12:00').toLocaleDateString('fr-FR', {weekday: 'short'}).replace('.', '');
const addDays = (iso, n) => { const t = new Date(iso + 'T12:00'); t.setDate(t.getDate() + n); return t.toISOString().slice(0, 10); };
const mean = a => { a = a.filter(x => x != null); return a.length ? a.reduce((s, x) => s + x, 0) / a.length : null; };
const sum = a => a.filter(x => x != null).reduce((s, x) => s + x, 0);
const sd = a => { a = a.filter(x => x != null); if (a.length < 2) return null; const m = mean(a); return Math.sqrt(mean(a.map(x => (x - m) ** 2))); };
const median = a => { a = a.filter(x => x != null).sort((x, y) => x - y); return a.length ? a[Math.floor(a.length / 2)] : null; };
const recColor = v => v == null ? css('--line') : v >= 67 ? css('--green') : v >= 34 ? css('--yellow') : css('--red');
const isFoot = s => ['Run', 'TrailRun', 'VirtualRun', 'Walk', 'Hike'].includes(s);
const pace = a => !a.speed ? null : isFoot(a.sport) ? (s => `${Math.floor(s / 60)}:${String(Math.round(s % 60)).padStart(2, '0')} /km`)(1000 / a.speed) : fmt(a.speed * 3.6, 1) + ' km/h';

// ---------- données minute par minute (FC + pas)
const MIN = new Map();
for (const [date, arr] of Object.entries(D.curves)) {
  const base = Math.round(new Date(date + 'T00:00').getTime() / 60000);
  for (let i = 0; i < arr.length; i += 3) MIN.set(base + arr[i], {hr: arr[i + 1] || null, st: arr[i + 2]});
}
const epochMin = iso => Math.round(new Date(iso).getTime() / 60000);
const dayBase = date => Math.round(new Date(date + 'T00:00').getTime() / 60000);
const minLabel = t => new Date(t * 60000).toLocaleTimeString('fr-FR', {hour: '2-digit', minute: '2-digit'});
function hrBetween(a, b) { const out = []; for (let t = a; t <= b; t++) { const m = MIN.get(t); if (m && m.hr) out.push({x: t - a, y: m.hr, t}); } return out; }
const nightOf = date => D.sleeps.filter(s => s.date === date && s.type === 'Nuit').sort((a, b) => b.asleep - a.asleep)[0];
function busyMinutes(date) {  // minutes de sommeil ou d'activité (exclues du stress)
  const set = new Set(), a = dayBase(date), b = a + 1440;
  [...D.sleeps, ...D.acts].forEach(s => { for (let t = Math.max(a, epochMin(s.start)); t < Math.min(b, epochMin(s.end)); t++) set.add(t); });
  return set;
}

// ---------- stress (0-3), inspiré du Stress Monitor du WHOOP 5.0
function refRhr(idx) { for (let i = idx; i >= Math.max(0, idx - 14); i--) if (D.days[i].rhr) return D.days[i].rhr; return null; }
function stressDay(idx) {
  const d = D.days[idx], base = dayBase(d.date), busy = busyMinutes(d.date), pts = [];
  let ref = refRhr(idx);
  if (!ref) { const hs = []; for (let m = 0; m < 1440; m++) { const v = MIN.get(base + m); if (v && v.hr) hs.push(v.hr); } ref = hs.length ? Math.min(...hs) : null; }
  if (!ref) return null;
  const span = Math.max(15, (HRMAX - ref) * 0.35);
  for (let m = 0; m < 1440; m++) {
    const t = base + m, v = MIN.get(t);
    if (v && v.hr && !busy.has(t)) pts.push({x: m, t, y: Math.max(0, Math.min(3, (v.hr - ref) / span * 3))});
  }
  if (pts.length < 30) return null;
  const sm = pts.map((p, i) => ({...p, y: mean(pts.slice(Math.max(0, i - 4), i + 5).filter(q => Math.abs(q.x - p.x) <= 6).map(q => q.y))}));
  const lvl = [0, 0, 0]; sm.forEach(p => lvl[p.y < 1 ? 0 : p.y < 2 ? 1 : 2]++);
  return {pts: sm, avg: mean(sm.map(p => p.y)), lvl, ref};
}
const STRESS = {};
const stressOf = idx => (idx in STRESS) ? STRESS[idx] : (STRESS[idx] = stressDay(idx));

// ---------- indicateurs
const M = {
  recovery: {name: 'Recovery', unit: '%', dig: 0, color: '--green', type: 'bar', min: 0, max: 100, colorFn: recColor, better: 'up',
    desc: 'Ta capacité à encaisser un effort aujourd’hui : HRV et FC de repos de la nuit comparées à ta référence personnelle (30 nuits), plus la qualité du sommeil.'},
  strain: {name: 'Strain', unit: '/ 21', dig: 1, color: '--blue', type: 'bar', min: 0, max: 21,
    desc: 'Charge cardio-vasculaire de la journée, de 0 à 21 (échelle logarithmique) : temps passé dans chaque zone de fréquence cardiaque.'},
  sleepH: {name: 'Sommeil', unit: 'h', dig: 1, color: '--violet', type: 'bar', min: 0, get: d => d.sleep == null ? null : d.sleep / 60,
    desc: 'Temps réellement endormi pendant la nuit (hors réveils).'},
  hrv: {name: 'HRV', unit: 'ms', dig: 0, color: '--violet', better: 'up',
    desc: 'Variabilité de la fréquence cardiaque pendant la nuit (RMSSD). Plus elle est haute par rapport à ton habitude, mieux ton système nerveux a récupéré.'},
  rhr: {name: 'FC de repos', unit: 'bpm', dig: 0, color: '--red', better: 'down',
    desc: 'Fréquence cardiaque la plus basse de la nuit (moyenne sur 5 min). Une hausse inhabituelle signale souvent fatigue, stress, alcool ou début de maladie.'},
  resp: {name: 'Respiration', unit: '/min', dig: 1, color: '--teal',
    desc: 'Fréquence respiratoire pendant le sommeil, déduite du rythme cardiaque (expérimental). Elle varie très peu d’une nuit à l’autre : une hausse nette peut annoncer une maladie.'},
  spo2: {name: 'SpO2', unit: '%', dig: 0, color: '--blue', desc: 'Saturation du sang en oxygène, mesurée par le bracelet pendant le sommeil (expérimental). Normalement entre 95 et 100 %.'},
  temp: {name: 'Temp. peau', unit: '°C', dig: 1, color: '--yellow',
    desc: 'Température de la peau pendant la nuit. C’est l’écart à ton habitude qui compte : une hausse de plus de 0,5 °C mérite attention.'},
  vo2: {name: 'VO2max', unit: 'ml/kg/min', dig: 1, color: '--blue', better: 'up',
    desc: 'Estimation de ta capacité aérobie (formule d’Uth : FC max / FC de repos des 7 dernières nuits). Elle progresse avec l’endurance.'},
  steps: {name: 'Pas', unit: '', dig: 0, color: '--green', type: 'bar', min: 0, better: 'up', desc: 'Nombre de pas compté par le bracelet.'},
  cal: {name: 'Calories', unit: 'kcal', dig: 0, color: '--amber', type: 'bar', min: 0,
    desc: 'Dépense énergétique estimée sur les minutes mesurées : métabolisme de base + effort (fréquence cardiaque, âge, poids, sexe).'},
  stress: {name: 'Stress', unit: '/ 3', dig: 1, color: '--amber', min: 0, max: 3, better: 'down', get: (d, i) => { const s = stressOf(i); return s ? s.avg : null; },
    desc: 'Niveau de stress moyen de la journée, de 0 à 3, hors sommeil et activités : fréquence cardiaque au-dessus de ton repos sans effort physique. Calme < 1, modéré 1-2, élevé > 2.'},
};
const val = (d, k, i) => d ? (M[k] && M[k].get ? M[k].get(d, i ?? IDX[d.date]) : d[k]) : null;
const range = (key, endIdx, n) => D.days.slice(Math.max(0, endIdx - n + 1), endIdx + 1).map((d, j) => ({date: d.date, y: val(d, key, Math.max(0, endIdx - n + 1) + j)}));
function stats(key, endIdx, n) {

// ---------- sommeil : dette, régularité, heure de coucher conseillée
function sleepWeek(idx) {
  const nights = D.days.slice(Math.max(0, idx - 6), idx + 1).map(x => nightOf(x.date)).filter(Boolean);
  const tod = iso => { const t = new Date(iso); let m = t.getHours() * 60 + t.getMinutes(); return m < 720 ? m + 1440 : m; };
  const debt = sum(nights.map(x => Math.max(0, NEED - x.asleep)));
  const wake = median(nights.map(x => tod(x.end))), awake = mean(nights.map(x => x.inbed - x.asleep)) || 15;

    wake, bedtime: wake == null ? null : wake - tonightNeed - awake, tonightNeed};
}

function contrib(title, sub, valueTxt, v, b, better) {

    const good = better ? ((v - b.avg) > 0) === (better === 'up') : null;
    const color = Math.abs(v - b.avg) <= b.sd || good === null ? css('--muted') : good ? css('--green') : css('--red');
    bar = `<div class="range"><b style="left:${Math.max(0, nlo)}%;width:${Math.min(100, nw)}%"></b><i style="left:${pos}%;background:${color}"></i></div>`;

// ---------- âge physiologique (inspiré du « WHOOP Age » : 8 habitudes sur les 30 derniers jours)
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function bioAge() {
  const P = D.profile; if (!P.age || D.days.length < 3) return null;
  const male = !P.sex || String(P.sex).toUpperCase().startsWith('H'), days = D.days.slice(-30), n = days.length;
  const nights = days.map(d => nightOf(d.date)).filter(Boolean), f = [];
  const add = (name, value, delta, advice) => f.push({name, value, delta: Math.abs(delta) < 0.05 ? 0 : +delta.toFixed(2), advice});
  const vo2 = [...days].reverse().find(d => d.vo2 != null)?.vo2;
  if (vo2) { const norm = male ? 47 - 0.33 * (P.age - 20) : 41 - 0.30 * (P.age - 20);
    add('VO2max', `${fmt(vo2, 1)} ml/kg/min (moyenne de ton âge : ${fmt(norm, 0)})`, clamp((norm - vo2) * 0.3, -4, 4), 'Endurance : course, vélo, natation 2-3 fois par semaine.'); }
  const rhr = mean(days.map(d => d.rhr));
  if (rhr) add('FC de repos', `${fmt(rhr)} bpm en moyenne`, clamp((rhr - 62) * 0.15, -3, 3), 'Elle baisse avec l’endurance, le sommeil et moins d’alcool.');
  if (nights.length >= 3) {
    const h = mean(nights.map(x => x.asleep)) / 60;
    add('Durée du sommeil', `${hm(h * 60)} par nuit`, h < 7 ? clamp((7 - h) * 0.6, 0, 3) : h > 9 ? clamp((h - 9) * 0.3, 0, 1.5) : -0.5, 'Vise 7 à 9 h par nuit.');
    const tod = iso => { const t = new Date(iso); let m = t.getHours() * 60 + t.getMinutes(); return m < 720 ? m + 1440 : m; };
    const sdb = sd(nights.map(x => tod(x.start)));
    if (sdb != null) add('Régularité du sommeil', `coucher à ± ${fmt(sdb)} min`, clamp((sdb - 45) / 30 * 0.5, -1, 1.5), 'Couche-toi et lève-toi à heures fixes, même le week-end.');
  }
  const full = days.filter(d => d.hours >= 12);
  if (full.length) { const st = mean(full.map(d => d.steps));
    add('Pas par jour', `${fmt(st)} en moyenne`, clamp((8000 - st) / 2000 * 0.5, -1.5, 2), 'Vise au moins 8 000 pas par jour.'); }
  const wk = z => sum(days.map(d => sum((d.zones || []).slice(z[0], z[1])))) * 7 / n;
  const mod = wk([0, 3]), vig = wk([3, 5]);
  add('Effort modéré (zones 1-3)', `${hm(mod)} par semaine (objectif 2 h 30)`, clamp((150 - mod) / 150 * 1.2, -1.2, 1.2), '150 min par semaine d’effort modéré (marche rapide, footing léger).');
  add('Effort intense (zones 4-5)', `${hm(vig)} par semaine (objectif 1 h 15)`, clamp((75 - vig) / 75 * 0.8, -1, 0.8), '75 min par semaine d’effort intense (fractionné, sport collectif).');
  const total = sum(f.map(x => x.delta));
  return {real: P.age, bio: +(P.age + total).toFixed(1), diff: +total.toFixed(1), factors: f.sort((a, b) => b.delta - a.delta), days: n};
}

  const a = bioAge();
  if (!a) return `<div class="title"><h1>Âge physiologique</h1></div><div class="card empty">Il faut ta date de naissance (profil) et au moins 3 jours de données.</div>`;
  const younger = a.diff < 0, maxD = Math.max(1, ...a.factors.map(x => Math.abs(x.delta)));
  return `<div class="title"><h1>Âge physiologique</h1><p>basé sur tes ${a.days} derniers jours${a.days < 30 ? ' · estimation provisoire, fiable après 30 jours' : ''}</p></div>

  <div class="card"><h2><span>Ce qui te rajeunit ou te vieillit</span><span>en années</span></h2>
    ${a.factors.map(x => `<div class="contrib"><div><div class="t">${x.name}</div><div class="s">${x.value}</div></div>
      <div class="r ${x.delta < -0.05 ? 'good' : x.delta > 0.05 ? 'bad' : ''}">${x.delta > 0 ? '+' : ''}${fmt(x.delta, 1)} an${Math.abs(x.delta) >= 2 ? 's' : ''}</div>

    const r = await gh(cfg, 'contents/' + p, {headers: {Accept: 'application/vnd.github.raw'}});
    const u8 = new Uint8Array(await r.arrayBuffer()), txt = p.endsWith('.gz') ? await gunzip(u8) : new TextDecoder().decode(u8);
    for (const x of JSON.parse(txt).minutes) map.set(x[0], unpackMin(x));
  }
  const e = await gh(cfg, 'contents/etat.json', {headers: {Accept: 'application/vnd.github.raw'}});
  const etat = e.ok ? await e.json() : {};
  await tx('minutes', 'readwrite', s => s.clear());
  await tx('minutes', 'readwrite', s => { for (const m of map.values()) s.put(m); });
  if (etat.state) await kvSet('state', Object.assign({}, DEFAULT_STATE, etat.state));
  if (etat.profil) await kvSet('profil', etat.profil);
  return map.size;
}

// Allège le téléphone : les battements (RR) ne servent qu'au sommeil (HRV, respiration) ;
// on les retire des minutes d'éveil de plus de 2 jours.
async function prune(raw, sleeps) {
  const cutoff = Math.floor(Date.now() / 60000) - 2880, keep = sleeps.map(s => [s.startTm - 30, s.endTm + 30]);
  const drop = raw.filter(m => m.t < cutoff && m.b.length && !keep.some(([a, b]) => m.t >= a && m.t <= b));
  if (drop.length) await tx('minutes', 'readwrite', s => { for (const m of drop) s.put({...m, b: []}); });
  return drop.length;
}

// ---------------------------------------------------------------- import / export / réglages
async function importFile(file) {
  const u8 = new Uint8Array(await file.arrayBuffer());
  const gz = u8[0] === 0x1f && u8[1] === 0x8b, data = JSON.parse(gz ? await gunzip(u8) : new TextDecoder().decode(u8));
  if (!data.minutes || !data.state) throw new Error('Fichier non reconnu.');
  const map = new Map(); for (const m of data.minutes) { const x = Array.isArray(m) ? unpackMin(m) : m; map.set(x.t, x); }
  await tx('minutes', 'readwrite', s => s.clear());
  await putMinutes(map);
  await kvSet('state', Object.assign({}, DEFAULT_STATE, data.state));
  if (data.profil) await kvSet('profil', data.profil);
  return map.size;
}
async function exportData() {  // fichier compact et compressé (format v2)
  const {bytes, gz} = await gzip(JSON.stringify({version: 2, minutes: (await allMinutes()).map(packMin), state: await getState(), profil: await kvGet('profil')}));
  const name = `whoop_sauvegarde_${dateLocal(Date.now())}.json${gz ? '.gz' : ''}`, file = new File([bytes], name, {type: 'application/octet-stream'});
  if (navigator.canShare && navigator.canShare({files: [file]})) return navigator.share({files: [file], title: name});
  const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = name; a.click();
}
const mb = n => (n / 1048576).toLocaleString('fr-FR', {maximumFractionDigits: 1}) + ' Mo';
function settings() {
  const el = document.createElement('div');
  el.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:30;display:grid;place-items:end center';
  Promise.all([kvGet('profil'), kvGet('backup'), navigator.storage && navigator.storage.estimate ? navigator.storage.estimate() : null]).then(([p, bk, est]) => {
    p = p || {}; bk = bk || {};
    const inp = (id, label, type, value, extra = '') => `<label style="display:block;margin:10px 0 4px;font-size:12px;color:var(--muted)">${label}</label>
      <input ${id} type="${type}" value="${value ?? ''}" ${extra} style="width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font:inherit">`;
    const f = (k, label, type, extra) => inp(`data-k="${k}"`, label, type, p[k], extra);
    const btn = (id, label, primary) => `<button id="${id}" style="width:100%;margin-top:10px;padding:12px;border-radius:12px;border:${primary ? '0' : '1px solid var(--line)'};
      background:${primary ? 'var(--fg)' : 'var(--card)'};color:${primary ? 'var(--bg)' : 'var(--fg)'};font:inherit;font-weight:600">${label}</button>`;
    const h = t => `<b style="display:block;font-size:15px;margin:26px 0 2px">${t}</b>`;
    const status = bk.token ? `Activée${bk.last ? ` · dernière sauvegarde ${new Date(bk.last).toLocaleString('fr-FR', {dateStyle: 'short', timeStyle: 'short'})}` : ''}` : 'Non configurée';
    el.innerHTML = `<div style="background:var(--card);width:min(520px,100%);max-height:90vh;overflow:auto;border-radius:20px 20px 0 0;padding:20px 18px max(24px,env(safe-area-inset-bottom))">
      <div style="display:flex;justify-content:space-between;align-items:center"><b style="font-size:17px">Réglages</b><button id="x" class="syncb">✕</button></div>
      ${h('Profil')}${f('naissance', 'Date de naissance', 'date')}${f('sexe', 'Sexe (H ou F)', 'text', 'maxlength="1"')}${f('poids', 'Poids (kg)', 'number', 'step="0.1"')}
      ${f('taille', 'Taille (cm)', 'number')}${f('fcMax', 'FC max (bpm, laisser vide si inconnue)', 'number')}${f('besoin', 'Besoin de sommeil (heures)', 'number', 'step="0.25"')}
      ${btn('save', 'Enregistrer le profil', true)}
      ${h('Sauvegarde automatique')}<p style="font-size:12px;color:var(--muted)">Après chaque synchro, les jours modifiés sont envoyés (compressés) dans ton dépôt GitHub privé. Statut : <b>${status}</b></p>
      ${inp('id="repo"', 'Dépôt privé (nom-utilisateur/whoop-donnees)', 'text', bk.repo, 'autocapitalize="off" autocorrect="off"')}
      ${inp('id="token"', 'Clé d’accès GitHub (fine-grained token)', 'password', bk.token, 'autocapitalize="off" autocorrect="off"')}
      ${btn('bk', 'Activer et sauvegarder maintenant', true)}${btn('rs', 'Restaurer depuis GitHub')}
      ${h('Fichier')}${btn('exp', 'Sauvegarder dans un fichier')}${btn('imp', 'Importer un fichier (PC ou sauvegarde)')}
      <input id="file" type="file" style="display:none">
      <p style="font-size:12px;color:var(--muted);margin-top:14px">${est ? `Espace utilisé dans le téléphone : ${mb(est.usage || 0)}` : ''}</p>
      <p id="msg" style="font-size:13px;margin-top:10px"></p></div>`;
    const msg = t => el.querySelector('#msg').textContent = t;
    el.querySelector('#x').onclick = () => el.remove();
    el.querySelector('#save').onclick = async () => {
      const o = {}; el.querySelectorAll('input[data-k]').forEach(i => { const v = i.value.trim(); o[i.dataset.k] = v === '' ? null : i.type === 'number' ? +v : v; });
      if (o.sexe) o.sexe = o.sexe.toUpperCase(); await kvSet('profil', o); location.reload(); };
    el.querySelector('#bk').onclick = async () => {
      const repo = el.querySelector('#repo').value.trim().replace(/^https?:\/\/github\.com\//, '').replace(/\/$/, ''), token = el.querySelector('#token').value.trim();
      if (!/^[\w.-]+\/[\w.-]+$/.test(repo) || !token) return msg('Renseigne le dépôt (nom-utilisateur/whoop-donnees) et la clé d’accès.');
      const old = (await kvGet('backup')) || {};
      await kvSet('backup', {...old, repo, token, ...(old.repo !== repo ? {lastT: null} : {})});
      try { const r = await backupGitHub(msg, old.repo !== repo || !old.last); msg(`Sauvegarde OK ✓ : ${r.days} jour(s), ${mb(r.bytes)}`); }
      catch (e) { msg('Sauvegarde impossible : ' + e.message); }
    };
    el.querySelector('#rs').onclick = async () => {
      if (!confirm('Remplacer les données de ce téléphone par la sauvegarde GitHub ?')) return;
      try { const n = await restoreGitHub(msg); msg(n + ' minutes restaurées.'); setTimeout(() => location.reload(), 800); }
      catch (e) { msg('Restauration impossible : ' + e.message); }
    };
    el.querySelector('#exp').onclick = () => exportData().catch(e => msg('Sauvegarde impossible : ' + e.message));
    el.querySelector('#imp').onclick = () => el.querySelector('#file').click();
    el.querySelector('#file').onchange = async e => { try { msg('Import en cours…'); const n = await importFile(e.target.files[0]); msg(n + ' minutes importées.'); setTimeout(() => location.reload(), 700); }
      catch (err) { msg('Import impossible : ' + err.message); } };
  });
  document.body.appendChild(el);
}

// ---------------------------------------------------------------- démarrage
async function start() {
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}  // évite l'effacement automatique
  const state = await getState(), raw = await allMinutes(), profil = await kvGet('profil');
  window.D_DATA = compute(raw, state, profil);
  prune(raw, window.D_DATA.sleeps).catch(() => {});
  window.WHOOP_SERVER = true;  // affiche le bouton ↻ de l'interface
  const ui = document.getElementById('ui'), s = document.createElement('script');
  s.textContent = ui.textContent; document.body.appendChild(s);
  window.startSync = async () => {
    if (window.__syncing) return; window.__syncing = true;
    document.querySelector('.syncb') && document.querySelector('.syncb').classList.add('spin');
    try {
      const r = await syncBracelet(t => window.sheet('Synchronisation du bracelet…', [t]));
      const lines = [`${r.added} nouvelles mesures · ${r.gaps ? r.gaps + ' manquantes' : 'aucune perte'}`];
      window.sheet(r.complete ? 'Synchro terminée ✓' : 'Synchro partielle', lines);
      try {
        const b = await backupGitHub(t => window.sheet('Sauvegarde automatique…', [t]));
        lines.push(b ? `sauvegardé sur GitHub ✓ (${mb(b.bytes)})` : 'sauvegarde auto non configurée (Réglages)');
      } catch (e) { lines.push('sauvegarde GitHub échouée : ' + e.message); }
      window.sheet(r.complete ? 'Synchro terminée ✓' : 'Synchro partielle', lines);
      setTimeout(() => location.reload(), 2200);
    } catch (e) {
      window.__syncing = false; document.querySelector('.syncb') && document.querySelector('.syncb').classList.remove('spin');
      window.sheet('Synchro impossible', [e.message]); setTimeout(() => window.sheet('', [], false), 8000);
    }
  };
  const foot = document.getElementById('foot'), a = document.createElement('a');
  a.textContent = 'Réglages · sauvegarde · import'; a.href = 'javascript:void 0'; a.style.cssText = 'display:inline-block;margin-top:10px;text-decoration:underline';
  a.onclick = settings; foot.appendChild(document.createElement('br')); foot.appendChild(a);
  if (window.WHOOP_VERSION) foot.appendChild(Object.assign(document.createElement('div'), {textContent: 'version ' + window.WHOOP_VERSION, style: 'opacity:.6'}));
  if (!raw.length) settings();
}
window.WHOOP_ENGINE = {decodeR18, decodeFrame, encodeCmd, Reassembler, ingest, compute, newMin, start, DEFAULT_STATE,
  packMin, unpackMin, gzip, gunzip, byDayMinutes};
if (!window.WHOOP_TEST) start().catch(e => { document.getElementById('app').innerHTML = '<div class="card">Erreur au démarrage : ' + e.message + '</div>'; });
})();

</script>
